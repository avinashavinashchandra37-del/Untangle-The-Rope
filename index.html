<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rope Challenge Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f0f13;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            touch-action: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        #game-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 800px;
            z-index: 10;
        }

        canvas {
            display: block;
            background-color: transparent;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

<!-- Main Menu UI -->
<div id="main-menu" class="absolute inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm">
    <div class="bg-gray-900 p-8 rounded-3xl border border-gray-700 text-center max-w-sm w-full mx-4 shadow-2xl">
        <h1 class="text-4xl font-black text-white mb-2 uppercase tracking-widest leading-tight">
            <span class="text-yellow-400">Rope</span><br/>
            <span class="text-green-400 text-2xl">Challenge</span>
        </h1>
        <p class="text-gray-400 mb-8 text-sm font-medium">Untangle all the ropes to win!</p>
        
        <button id="btn-local" class="w-full mb-4 bg-gray-800 hover:bg-gray-700 text-white font-bold py-4 px-6 rounded-xl border border-gray-600 transition-all shadow-lg active:scale-95">
            Play on this device
        </button>
        <button id="btn-online" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 px-6 rounded-xl border border-blue-400 transition-all shadow-lg shadow-blue-900/50 active:scale-95">
            Play Online (Multiplayer)
        </button>
    </div>
</div>

<!-- Multiplayer Room UI -->
<div id="room-ui" class="hidden absolute top-6 left-1/2 -translate-x-1/2 z-40 bg-gray-900/90 backdrop-blur rounded-2xl border border-gray-700 p-4 shadow-2xl flex items-center gap-6">
    <div class="text-sm text-left">
        <span class="text-gray-400 block text-xs font-bold uppercase tracking-wider mb-1">Room Code</span>
        <span id="room-code-display" class="text-2xl font-black tracking-widest text-white">---</span>
    </div>
    <button id="btn-copy" class="bg-blue-600 hover:bg-blue-500 py-2 px-4 rounded-xl text-sm font-bold transition-colors active:scale-95 whitespace-nowrap">
        Copy Link
    </button>
</div>

<!-- Connection / Toast Status -->
<div id="toast" class="hidden absolute bottom-10 left-1/2 -translate-x-1/2 z-50 bg-gray-800 border border-gray-600 text-white px-6 py-3 rounded-full font-bold shadow-xl transition-opacity duration-300">
    Message
</div>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
</div>

<!-- Firebase Modular SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Global Configuration
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'rope-challenge-multiplayer';
    let firebaseConfig = {};
    try {
        firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
    } catch (e) {}

    // Colors and Setup
    const THEME = {
        boardBase: '#1a1a1c',
        boardHighlight: '#2c2c30',
        boardShadow: '#0a0a0c',
        textYellow: '#facc15',
        textGreen: '#4ade80',
        slots: '#0d0d0f',
        slotHighlight: '#222',
        ropeColors: [
            { id: 'blue', hex: '#3b82f6', top: '#60a5fa', side: '#1d4ed8' },
            { id: 'orange', hex: '#f97316', top: '#fb923c', side: '#c2410c' },
            { id: 'purple', hex: '#a855f7', top: '#c084fc', side: '#7e22ce' },
            { id: 'teal', hex: '#14b8a6', top: '#2dd4bf', side: '#0f766e' },
            { id: 'yellow', hex: '#eab308', top: '#facc15', side: '#a16207' },
            { id: 'pink', hex: '#ec4899', top: '#f472b6', side: '#be185d' },
            { id: 'green', hex: '#22c55e', top: '#4ade80', side: '#15803d' }
        ],
        intersectRed: '#ef4444'
    };

    const NUM_SLOTS = 24;
    const TOTAL_ROPES = 6;
    
    // Canvas & Game State
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, centerX, centerY, boardRadius;
    
    let slots = [];
    let pegs = {}; 
    let user = null;
    let userId = null;
    let isConnected = false;
    let isLocalMode = false;
    let draggingPegId = null;
    let syncThrottle = 0;
    let boardDocRef = null;
    let currentRoomCode = null;

    // --- Utility & Setup ---
    function showToast(message, duration = 3000) {
        const toast = document.getElementById('toast');
        toast.innerText = message;
        toast.classList.remove('hidden');
        toast.style.opacity = 1;
        setTimeout(() => {
            toast.style.opacity = 0;
            setTimeout(() => toast.classList.add('hidden'), 300);
        }, duration);
    }

    function generateRandomRoomCode() {
        return Math.random().toString(36).substring(2, 6).toUpperCase();
    }

    function generateInitialPegs() {
        const initialPegs = {};
        // 1. Generate solvable (adjacent) non-intersecting layout
        let tempPegs = [];
        for (let i = 0; i < TOTAL_ROPES; i++) {
            const colorData = THEME.ropeColors[i % THEME.ropeColors.length];
            tempPegs.push({ id: `rope_${i}_A`, ropeId: i, colorId: colorData.id, slot: i * 2 });
            tempPegs.push({ id: `rope_${i}_B`, ropeId: i, colorId: colorData.id, slot: i * 2 + 1 });
        }
        
        // 2. Shuffle slots completely to tangle the ropes
        let availableSlots = [];
        for (let i = 0; i < NUM_SLOTS; i++) availableSlots.push(i);
        
        for (let i = availableSlots.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [availableSlots[i], availableSlots[j]] = [availableSlots[j], availableSlots[i]];
        }
        
        // 3. Assign
        for (let i = 0; i < tempPegs.length; i++) {
            const p = tempPegs[i];
            initialPegs[p.id] = {
                id: p.id,
                ropeId: p.ropeId,
                colorId: p.colorId,
                slot: availableSlots[i],
                x: 0, y: 0,
                draggedBy: null
            };
        }
        return initialPegs;
    }

    function computeSlotPositions() {
        slots = [];
        for (let i = 0; i < NUM_SLOTS; i++) {
            const angle = (i / NUM_SLOTS) * Math.PI * 2 - Math.PI / 2;
            const r = boardRadius * 0.85;
            slots.push({ index: i, x: centerX + r * Math.cos(angle), y: centerY + r * Math.sin(angle) });
        }
    }

    function updatePegCoordsFromSlots() {
        for (const [id, peg] of Object.entries(pegs)) {
            if (!peg.draggedBy && peg.slot >= 0 && peg.slot < slots.length) {
                peg.x = slots[peg.slot].x;
                peg.y = slots[peg.slot].y;
            }
        }
    }

    function resize() {
        const parent = canvas.parentElement;
        canvas.width = parent.clientWidth;
        canvas.height = parent.clientHeight;
        width = canvas.width;
        height = canvas.height;
        centerX = width / 2;
        centerY = height / 2;
        boardRadius = Math.min(width, height) / 2 * 0.95;
        
        computeSlotPositions();
        updatePegCoordsFromSlots();
    }
    
    window.addEventListener('resize', resize);

    // --- Math: Line Intersection ---
    function orientation(p, q, r) {
        let val = (q.y - p.y) * (r.x - q.x) - (q.x - p.x) * (r.y - q.y);
        if (Math.abs(val) < 0.001) return 0; // colinear
        return (val > 0) ? 1 : 2; // clock or counterclock wise
    }

    function doIntersect(p1, q1, p2, q2) {
        let o1 = orientation(p1, q1, p2);
        let o2 = orientation(p1, q1, q2);
        let o3 = orientation(p2, q2, p1);
        let o4 = orientation(p2, q2, q1);
        return (o1 !== o2 && o3 !== o4);
    }

    // --- Game Modes ---
    function startLocalGame() {
        document.getElementById('main-menu').classList.add('hidden');
        isLocalMode = true;
        userId = 'local-player';
        pegs = generateInitialPegs();
        resize();
        updatePegCoordsFromSlots();
        requestAnimationFrame(draw);
    }

    async function startOnlineGame(roomCodeToJoin = null) {
        showToast("Connecting to server...", 5000);
        
        if (Object.keys(firebaseConfig).length === 0) {
            showToast("No server config found. Starting Local Mode.");
            startLocalGame();
            return;
        }

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        try {
            if (typeof __initial_auth_token !== 'undefined') {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
            user = auth.currentUser;
            userId = user.uid;
            
            // Determine Room
            currentRoomCode = roomCodeToJoin || generateRandomRoomCode();
            
            // Update URL to make it shareable
            const newUrl = new URL(window.location.href);
            newUrl.searchParams.set('room', currentRoomCode);
            window.history.pushState({}, '', newUrl);

            // Show UI
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('room-ui').classList.remove('hidden');
            document.getElementById('room-code-display').innerText = currentRoomCode;

            // Strict Rule 1: Use specific public path
            boardDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', currentRoomCode);
            
            // Initialize or Join
            const docSnap = await getDoc(boardDocRef);
            if (!docSnap.exists()) {
                await setDoc(boardDocRef, {
                    pegs: generateInitialPegs(),
                    createdAt: Date.now(),
                    lastUpdated: Date.now()
                });
            }
            
            // Sync
            onSnapshot(boardDocRef, (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    if (data.pegs) {
                        pegs = data.pegs;
                        if (width) updatePegCoordsFromSlots();
                    }
                }
            }, (err) => {
                console.error("Firebase sync error:", err);
            });

            isConnected = true;
            isLocalMode = false;
            showToast("Connected to Room " + currentRoomCode);
            resize();
            requestAnimationFrame(draw);

        } catch (error) {
            console.error("Auth error:", error);
            showToast("Connection failed. Check network.");
            document.getElementById('main-menu').classList.remove('hidden');
        }
    }

    async function pushStateUpdate(pegId) {
        if (isLocalMode) return; // No network push needed
        if (!isConnected || !boardDocRef || !user) return;
        
        const pegData = pegs[pegId];
        const updatePayload = {};
        updatePayload[`pegs.${pegId}`] = pegData;
        updatePayload['lastUpdated'] = Date.now();
        
        try {
            await updateDoc(boardDocRef, updatePayload);
        } catch(e) {
            console.error("Error updating doc", e);
        }
    }

    // --- Input Handling ---
    function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    function handleStart(e) {
        // Prevent interaction if menu is open
        if (!document.getElementById('main-menu').classList.contains('hidden')) return;

        const pos = getPointerPos(e);
        let clickedPegId = null;
        let minRadius = 9999;
        
        for (const [id, peg] of Object.entries(pegs)) {
            if (!isLocalMode && peg.draggedBy && peg.draggedBy !== userId) continue;
            
            const dx = pos.x - peg.x;
            const dy = pos.y - (peg.y - 10);
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < 30 && dist < minRadius) {
                minRadius = dist;
                clickedPegId = id;
            }
        }
        
        if (clickedPegId) {
            if (e.cancelable) e.preventDefault();
            draggingPegId = clickedPegId;
            pegs[draggingPegId].draggedBy = userId;
            pushStateUpdate(draggingPegId);
        }
    }

    function handleMove(e) {
        if (draggingPegId) {
            if (e.cancelable) e.preventDefault();
            const pos = getPointerPos(e);
            
            pegs[draggingPegId].x = pos.x;
            pegs[draggingPegId].y = pos.y;
            
            const now = Date.now();
            if (now - syncThrottle > 80) {
                pushStateUpdate(draggingPegId);
                syncThrottle = now;
            }
        }
    }

    function handleEnd(e) {
        if (draggingPegId) {
            const peg = pegs[draggingPegId];
            let closestSlot = 0;
            let minDist = 99999;
            
            for (let i = 0; i < slots.length; i++) {
                const s = slots[i];
                const dx = peg.x - s.x;
                const dy = peg.y - s.y;
                const dist = dx * dx + dy * dy;
                if (dist < minDist) {
                    minDist = dist;
                    closestSlot = i;
                }
            }
            
            peg.slot = closestSlot;
            peg.x = slots[closestSlot].x;
            peg.y = slots[closestSlot].y;
            peg.draggedBy = null;
            
            pushStateUpdate(draggingPegId);
            draggingPegId = null;
        }
    }

    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove, {passive: false});
    window.addEventListener('mouseup', handleEnd);
    canvas.addEventListener('touchstart', handleStart, {passive: false});
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('touchend', handleEnd);

    // --- UI Listeners ---
    document.getElementById('btn-local').addEventListener('click', startLocalGame);
    document.getElementById('btn-online').addEventListener('click', () => startOnlineGame(null));
    document.getElementById('btn-copy').addEventListener('click', () => {
        const link = window.location.href;
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(link).then(() => showToast('Invite link copied!'));
        } else {
            // Fallback for iframe
            const textArea = document.createElement("textarea");
            textArea.value = link;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('Invite link copied!');
            } catch (err) {
                showToast('Failed to copy link.');
            }
            document.body.removeChild(textArea);
        }
    });

    // --- Rendering ---
    function drawHexagon(ctx, x, y, radius, colorTop, colorSide, isDragging) {
        const tiltY = 0.75; 
        const depth = isDragging ? 18 : 12; 
        const liftY = isDragging ? -8 : 0;
        
        ctx.fillStyle = colorSide;
        ctx.beginPath();
        for (let i = 0; i <= 6; i++) {
            const angle = i * Math.PI / 3 + Math.PI/6;
            const px = x + radius * Math.cos(angle);
            const py = y + liftY + radius * Math.sin(angle) * tiltY;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        for (let i = 6; i >= 0; i--) {
            const angle = i * Math.PI / 3 + Math.PI/6;
            const px = x + radius * Math.cos(angle);
            const py = y + liftY + depth + radius * Math.sin(angle) * tiltY;
            ctx.lineTo(px, py);
        }
        ctx.fill();
        
        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 6; i++) {
            const angle = i * Math.PI / 3 + Math.PI/6;
            const px = x + radius * Math.cos(angle);
            const pyTop = y + liftY + radius * Math.sin(angle) * tiltY;
            const pyBot = y + liftY + depth + radius * Math.sin(angle) * tiltY;
            ctx.beginPath();
            ctx.moveTo(px, pyTop);
            ctx.lineTo(px, pyBot);
            ctx.stroke();
        }

        ctx.fillStyle = colorTop;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const angle = i * Math.PI / 3 + Math.PI/6;
            const px = x + radius * Math.cos(angle);
            const py = y + liftY + radius * Math.sin(angle) * tiltY;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke(); 
        
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.arc(x, y + liftY, radius * 0.3, 0, Math.PI * 2);
        ctx.fill();
    }

    function draw() {
        if (!ctx || !width) return;
        ctx.clearRect(0, 0, width, height);

        // Board Base
        ctx.beginPath(); ctx.arc(centerX, centerY + 15, boardRadius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fill();

        ctx.beginPath(); ctx.arc(centerX, centerY + 10, boardRadius, 0, Math.PI * 2);
        ctx.fillStyle = THEME.boardShadow; ctx.fill();

        ctx.beginPath(); ctx.arc(centerX, centerY, boardRadius, 0, Math.PI * 2);
        const grad = ctx.createRadialGradient(centerX, centerY, boardRadius * 0.5, centerX, centerY, boardRadius);
        grad.addColorStop(0, '#26262a');
        grad.addColorStop(1, THEME.boardBase);
        ctx.fillStyle = grad; ctx.fill();
        
        ctx.lineWidth = 4; ctx.strokeStyle = THEME.boardHighlight; ctx.stroke();
        ctx.beginPath(); ctx.arc(centerX, centerY, boardRadius * 0.65, 0, Math.PI * 2);
        ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.stroke();

        // Text
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.font = '900 ' + (boardRadius * 0.35) + 'px Montserrat';
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillText('ROPE', 0, -boardRadius * 0.1 + 4);
        ctx.fillStyle = THEME.textYellow; ctx.fillText('ROPE', 0, -boardRadius * 0.1);
        ctx.font = '800 ' + (boardRadius * 0.12) + 'px Montserrat';
        ctx.letterSpacing = '2px'; ctx.fillStyle = THEME.textGreen;
        ctx.fillText('CHALLENGE', 0, boardRadius * 0.15);
        ctx.restore();

        // Slots
        for (let slot of slots) {
            ctx.beginPath(); ctx.arc(slot.x, slot.y, 14, 0, Math.PI * 2);
            ctx.fillStyle = THEME.slots; ctx.fill();
            ctx.lineWidth = 2; ctx.strokeStyle = THEME.slotHighlight; ctx.stroke();
            ctx.beginPath(); ctx.arc(slot.x, slot.y, 10, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fill();
        }

        // Calculate Ropes & Intersections
        const ropes = {};
        for (const peg of Object.values(pegs)) {
            if (!ropes[peg.ropeId]) ropes[peg.ropeId] = [];
            ropes[peg.ropeId].push(peg);
        }

        const lines = [];
        for (const [ropeId, ropePegs] of Object.entries(ropes)) {
            if (ropePegs.length === 2) {
                lines.push({ id: ropeId, p1: ropePegs[0], p2: ropePegs[1], intersecting: false });
            }
        }

        // Check intersections (Turns red when tangled)
        for (let i = 0; i < lines.length; i++) {
            for (let j = i + 1; j < lines.length; j++) {
                if (doIntersect(lines[i].p1, lines[i].p2, lines[j].p1, lines[j].p2)) {
                    lines[i].intersecting = true;
                    lines[j].intersecting = true;
                }
            }
        }

        // Draw Ropes
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        for (const line of lines) {
            const colorData = THEME.ropeColors.find(c => c.id === line.p1.colorId) || THEME.ropeColors[0];
            const strokeColor = line.intersecting ? THEME.intersectRed : colorData.hex;
            
            // Shadow
            ctx.beginPath(); ctx.moveTo(line.p1.x, line.p1.y + 10); ctx.lineTo(line.p2.x, line.p2.y + 10);
            ctx.strokeStyle = 'rgba(0,0,0,0.6)'; ctx.lineWidth = 10; ctx.stroke();
            
            // Rope Main
            ctx.beginPath(); ctx.moveTo(line.p1.x, line.p1.y); ctx.lineTo(line.p2.x, line.p2.y);
            ctx.strokeStyle = strokeColor; ctx.lineWidth = 8; ctx.stroke();
            
            // Highlight
            ctx.beginPath(); ctx.moveTo(line.p1.x, line.p1.y - 2); ctx.lineTo(line.p2.x, line.p2.y - 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 3; ctx.stroke();
        }

        // Draw Pegs
        for (const peg of Object.values(pegs)) {
            const colorData = THEME.ropeColors.find(c => c.id === peg.colorId) || THEME.ropeColors[0];
            const isBeingDragged = (peg.draggedBy === userId) || (isLocalMode && peg.id === draggingPegId);
            
            if (!isLocalMode && peg.draggedBy && peg.draggedBy !== userId) {
                ctx.globalAlpha = 0.7; // Dim if moved by another player
            }
            
            drawHexagon(ctx, peg.x, peg.y, 22, colorData.top, colorData.side, isBeingDragged);
            ctx.globalAlpha = 1.0;
        }

        requestAnimationFrame(draw);
    }

    // --- Init ---
    resize();
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('room')) {
        startOnlineGame(urlParams.get('room'));
    }
    
    // We do NOT start drawing until a mode is selected, saving resources.
</script>
</body>
</html>
