<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rope Challenge Multiplayer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0f0f13;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            touch-action: none; /* Prevent scrolling while dragging on mobile */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        #game-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 800px;
        }

        canvas {
            display: block;
            background-color: transparent;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 10;
        }

        #ui-layer {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
            z-index: 20;
        }

        .status-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: bold;
            letter-spacing: 1px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }
        
        #connection-status {
            color: #fbbf24; /* yellow */
        }
        #connection-status.connected {
            color: #4ade80; /* green */
        }
    </style>
</head>
<body>

<div id="ui-layer">
    <div id="connection-status" class="status-badge">Connecting to Multiplayer...</div>
</div>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
</div>

<!-- Firebase Modular SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Global Configuration
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'rope-challenge-multiplayer';
    let firebaseConfig = {};
    try {
        firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
    } catch (e) {
        console.error("Invalid firebase config");
    }

    // Colors and Setup
    const THEME = {
        boardBase: '#1a1a1c',
        boardHighlight: '#2c2c30',
        boardShadow: '#0a0a0c',
        textYellow: '#facc15',
        textGreen: '#4ade80',
        slots: '#0d0d0f',
        slotHighlight: '#222',
        ropeColors: [
            { id: 'red', hex: '#ef4444', top: '#f87171', side: '#b91c1c' },
            { id: 'blue', hex: '#3b82f6', top: '#60a5fa', side: '#1d4ed8' },
            { id: 'orange', hex: '#f97316', top: '#fb923c', side: '#c2410c' },
            { id: 'purple', hex: '#a855f7', top: '#c084fc', side: '#7e22ce' },
            { id: 'teal', hex: '#14b8a6', top: '#2dd4bf', side: '#0f766e' },
            { id: 'yellow', hex: '#eab308', top: '#facc15', side: '#a16207' },
            { id: 'pink', hex: '#ec4899', top: '#f472b6', side: '#be185d' }
        ]
    };

    const NUM_SLOTS = 24;
    const TOTAL_ROPES = 6;
    
    // Canvas & Game State
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, centerX, centerY, boardRadius;
    
    let slots = [];
    let pegs = {}; // Map of pegId -> pegData
    let user = null;
    let userId = null;
    let isConnected = false;
    let draggingPegId = null;
    let syncThrottle = 0;

    // Default starting positions if board is new
    function generateInitialPegs() {
        const initialPegs = {};
        let slotIdx = 0;
        
        for (let i = 0; i < TOTAL_ROPES; i++) {
            const colorData = THEME.ropeColors[i % THEME.ropeColors.length];
            
            // Peg A
            initialPegs[`rope_${i}_A`] = {
                id: `rope_${i}_A`,
                ropeId: i,
                colorId: colorData.id,
                slot: slotIdx,
                x: 0, y: 0, // Computed later based on slot
                draggedBy: null
            };
            
            // Peg B (put it roughly opposite)
            const oppSlot = (slotIdx + (NUM_SLOTS / 2) + i) % NUM_SLOTS;
            initialPegs[`rope_${i}_B`] = {
                id: `rope_${i}_B`,
                ropeId: i,
                colorId: colorData.id,
                slot: oppSlot,
                x: 0, y: 0,
                draggedBy: null
            };
            
            slotIdx = (slotIdx + 2) % NUM_SLOTS;
        }
        return initialPegs;
    }

    function computeSlotPositions() {
        slots = [];
        for (let i = 0; i < NUM_SLOTS; i++) {
            const angle = (i / NUM_SLOTS) * Math.PI * 2 - Math.PI / 2; // Start top
            const r = boardRadius * 0.85;
            slots.push({
                index: i,
                x: centerX + r * Math.cos(angle),
                y: centerY + r * Math.sin(angle)
            });
        }
    }

    function updatePegCoordsFromSlots() {
        for (const [id, peg] of Object.entries(pegs)) {
            // Only update pos from slot if NO ONE is dragging it
            if (!peg.draggedBy && peg.slot >= 0 && peg.slot < slots.length) {
                peg.x = slots[peg.slot].x;
                peg.y = slots[peg.slot].y;
            }
        }
    }

    function resize() {
        const parent = canvas.parentElement;
        canvas.width = parent.clientWidth;
        canvas.height = parent.clientHeight;
        width = canvas.width;
        height = canvas.height;
        centerX = width / 2;
        centerY = height / 2;
        boardRadius = Math.min(width, height) / 2 * 0.95;
        
        computeSlotPositions();
        updatePegCoordsFromSlots();
    }
    
    window.addEventListener('resize', resize);

    // --- Firebase Initialization ---
    async function initFirebase() {
        if (Object.keys(firebaseConfig).length === 0) {
            console.warn("No Firebase config provided. Running in local-only mode.");
            pegs = generateInitialPegs();
            resize();
            updatePegCoordsFromSlots();
            requestAnimationFrame(draw);
            document.getElementById('connection-status').innerText = "Local Mode Only";
            return;
        }

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        try {
            if (typeof __initial_auth_token !== 'undefined') {
                await signInWithCustomToken(auth, __initial_auth_token);
            } else {
                await signInAnonymously(auth);
            }
            
            user = auth.currentUser;
            userId = user.uid;
            
            setupMultiplayer(db);
            
            const statusEl = document.getElementById('connection-status');
            statusEl.innerText = "Connected";
            statusEl.classList.add('connected');
            isConnected = true;
            
            // Revert status message after a few seconds
            setTimeout(() => {
                statusEl.style.opacity = 0;
            }, 3000);

        } catch (error) {
            console.error("Auth error:", error);
            document.getElementById('connection-status').innerText = "Connection Failed";
        }
    }

    let boardDocRef;
    
    async function setupMultiplayer(db) {
        if (!user) return;
        
        // Strict Rule 1: Use specific public path
        boardDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'rope_board', 'state');
        
        // Check if exists, if not initialize
        const docSnap = await getDoc(boardDocRef);
        if (!docSnap.exists()) {
            await setDoc(boardDocRef, {
                pegs: generateInitialPegs(),
                lastUpdated: Date.now()
            });
        }
        
        // Listen to changes
        onSnapshot(boardDocRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (data.pegs) {
                    pegs = data.pegs;
                    // If window is ready, sync coordinates
                    if (width) {
                        updatePegCoordsFromSlots();
                    }
                }
            }
        }, (error) => {
            console.error("Firebase sync error:", error);
        });
    }

    async function pushStateUpdate(pegId) {
        if (!isConnected || !boardDocRef) return;
        
        // We only push updates for the specific peg being interacted with to avoid overwriting others
        const pegData = pegs[pegId];
        
        const updatePayload = {};
        updatePayload[`pegs.${pegId}`] = pegData;
        updatePayload['lastUpdated'] = Date.now();
        
        try {
            await updateDoc(boardDocRef, updatePayload);
        } catch(e) {
            console.error("Error updating doc", e);
        }
    }

    // --- Input Handling ---
    function getPointerPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    function handleStart(e) {
        const pos = getPointerPos(e);
        
        // Find clicked peg (prioritize tops of pegs)
        let clickedPegId = null;
        let minRadius = 9999;
        
        for (const [id, peg] of Object.entries(pegs)) {
            // Ignore if being dragged by someone else
            if (peg.draggedBy && peg.draggedBy !== userId) continue;
            
            const dx = pos.x - peg.x;
            const dy = pos.y - (peg.y - 10); // Offset for 3D top face
            const dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < 30 && dist < minRadius) {
                minRadius = dist;
                clickedPegId = id;
            }
        }
        
        if (clickedPegId) {
            if (e.cancelable) e.preventDefault();
            draggingPegId = clickedPegId;
            pegs[draggingPegId].draggedBy = userId;
            pushStateUpdate(draggingPegId);
        }
    }

    function handleMove(e) {
        if (draggingPegId) {
            if (e.cancelable) e.preventDefault();
            const pos = getPointerPos(e);
            
            pegs[draggingPegId].x = pos.x;
            pegs[draggingPegId].y = pos.y;
            
            // Throttle network updates for smooth dragging without spamming
            const now = Date.now();
            if (now - syncThrottle > 100) {
                pushStateUpdate(draggingPegId);
                syncThrottle = now;
            }
        }
    }

    function handleEnd(e) {
        if (draggingPegId) {
            // Find closest slot
            const peg = pegs[draggingPegId];
            let closestSlot = 0;
            let minDist = 99999;
            
            for (let i = 0; i < slots.length; i++) {
                const s = slots[i];
                const dx = peg.x - s.x;
                const dy = peg.y - s.y;
                const dist = dx * dx + dy * dy;
                if (dist < minDist) {
                    minDist = dist;
                    closestSlot = i;
                }
            }
            
            // Optional: check if slot is empty. If not, swap or fallback.
            // For simplicity and sandbox nature, we allow stacking or rely on players to resolve it.
            
            // Snap to slot
            peg.slot = closestSlot;
            peg.x = slots[closestSlot].x;
            peg.y = slots[closestSlot].y;
            peg.draggedBy = null;
            
            pushStateUpdate(draggingPegId);
            draggingPegId = null;
        }
    }

    canvas.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove, {passive: false});
    window.addEventListener('mouseup', handleEnd);
    
    canvas.addEventListener('touchstart', handleStart, {passive: false});
    window.addEventListener('touchmove', handleMove, {passive: false});
    window.addEventListener('touchend', handleEnd);

    // --- Rendering logic ---

    function drawHexagon(ctx, x, y, radius, colorTop, colorSide, isDragging) {
        const tiltY = 0.75; // Squash hexagon to look isometric-ish
        const depth = isDragging ? 18 : 12; // Deeper when lifted
        const liftY = isDragging ? -8 : 0;
        
        // Draw sides
        ctx.fillStyle = colorSide;
        ctx.beginPath();
        for (let i = 0; i <= 6; i++) {
            const angle = i * Math.PI / 3 + Math.PI/6;
            const px = x + radius * Math.cos(angle);
            const py = y + liftY + radius * Math.sin(angle) * tiltY;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        for (let i = 6; i >= 0; i--) {
            const angle = i * Math.PI / 3 + Math.PI/6;
            const px = x + radius * Math.cos(angle);
            const py = y + liftY + depth + radius * Math.sin(angle) * tiltY;
            ctx.lineTo(px, py);
        }
        ctx.fill();
        
        // Draw side borders for definition
        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 1;
        for (let i = 0; i < 6; i++) {
            const angle = i * Math.PI / 3 + Math.PI/6;
            const px = x + radius * Math.cos(angle);
            const pyTop = y + liftY + radius * Math.sin(angle) * tiltY;
            const pyBot = y + liftY + depth + radius * Math.sin(angle) * tiltY;
            ctx.beginPath();
            ctx.moveTo(px, pyTop);
            ctx.lineTo(px, pyBot);
            ctx.stroke();
        }

        // Draw top face
        ctx.fillStyle = colorTop;
        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
            const angle = i * Math.PI / 3 + Math.PI/6;
            const px = x + radius * Math.cos(angle);
            const py = y + liftY + radius * Math.sin(angle) * tiltY;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke(); // border
        
        // Center hole aesthetic
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.beginPath();
        ctx.arc(x, y + liftY, radius * 0.3, 0, Math.PI * 2);
        ctx.fill();
    }

    function draw() {
        if (!ctx || !width) return;
        
        ctx.clearRect(0, 0, width, height);

        // 1. Draw 3D Board Base
        // Drop Shadow
        ctx.beginPath();
        ctx.arc(centerX, centerY + 15, boardRadius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0,0,0,0.8)';
        ctx.fill();

        // Edge/Thickness
        ctx.beginPath();
        ctx.arc(centerX, centerY + 10, boardRadius, 0, Math.PI * 2);
        ctx.fillStyle = THEME.boardShadow;
        ctx.fill();

        // Top Face
        ctx.beginPath();
        ctx.arc(centerX, centerY, boardRadius, 0, Math.PI * 2);
        const grad = ctx.createRadialGradient(centerX, centerY, boardRadius * 0.5, centerX, centerY, boardRadius);
        grad.addColorStop(0, '#26262a');
        grad.addColorStop(1, THEME.boardBase);
        ctx.fillStyle = grad;
        ctx.fill();
        
        // Outer rim highlight
        ctx.lineWidth = 4;
        ctx.strokeStyle = THEME.boardHighlight;
        ctx.stroke();

        // Decorative inner rings (like the physical board)
        ctx.beginPath();
        ctx.arc(centerX, centerY, boardRadius * 0.65, 0, Math.PI * 2);
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.stroke();

        // 2. Draw Board Text "ROPE CHALLENGE"
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        // "ROPE"
        ctx.font = '900 ' + (boardRadius * 0.35) + 'px Montserrat';
        // Shadow for ROPE
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillText('ROPE', 0, -boardRadius * 0.1 + 4);
        ctx.fillStyle = THEME.textYellow;
        ctx.fillText('ROPE', 0, -boardRadius * 0.1);
        
        // "CHALLENGE"
        ctx.font = '800 ' + (boardRadius * 0.12) + 'px Montserrat';
        ctx.letterSpacing = '2px';
        ctx.fillStyle = THEME.textGreen;
        ctx.fillText('CHALLENGE', 0, boardRadius * 0.15);
        ctx.restore();

        // 3. Draw Slots
        for (let slot of slots) {
            ctx.beginPath();
            ctx.arc(slot.x, slot.y, 14, 0, Math.PI * 2);
            ctx.fillStyle = THEME.slots;
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = THEME.slotHighlight;
            ctx.stroke();
            
            // Inner deep shadow
            ctx.beginPath();
            ctx.arc(slot.x, slot.y, 10, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.8)';
            ctx.fill();
        }

        // 4. Group pegs by ropeId to draw ropes between them
        const ropes = {};
        for (const peg of Object.values(pegs)) {
            if (!ropes[peg.ropeId]) ropes[peg.ropeId] = [];
            ropes[peg.ropeId].push(peg);
        }

        // Draw Ropes
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        for (const [ropeId, ropePegs] of Object.entries(ropes)) {
            if (ropePegs.length === 2) {
                const p1 = ropePegs[0];
                const p2 = ropePegs[1];
                
                const colorData = THEME.ropeColors.find(c => c.id === p1.colorId) || THEME.ropeColors[0];
                
                // Rope shadow
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y + 10);
                ctx.lineTo(p2.x, p2.y + 10);
                ctx.strokeStyle = 'rgba(0,0,0,0.6)';
                ctx.lineWidth = 10;
                ctx.stroke();
                
                // Main rope
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.strokeStyle = colorData.hex;
                ctx.lineWidth = 8;
                ctx.stroke();
                
                // Rope highlight
                ctx.beginPath();
                ctx.moveTo(p1.x, p1.y - 2);
                ctx.lineTo(p2.x, p2.y - 2);
                ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                ctx.lineWidth = 3;
                ctx.stroke();
            }
        }

        // 5. Draw Pegs
        for (const peg of Object.values(pegs)) {
            const colorData = THEME.ropeColors.find(c => c.id === peg.colorId) || THEME.ropeColors[0];
            const isBeingDragged = (peg.draggedBy === userId) || (peg.draggedBy !== null && peg.draggedBy !== undefined);
            
            // Optional: Show if another player is moving it by slightly dimming
